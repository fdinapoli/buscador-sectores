<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador de sectores</title>
  <meta name="theme-color" content="#07100b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>&gt; <span id="titulo">Buscador de sectores</span><span class="cursor">_</span></h1>
    <button type="button" id="instalar" class="instalar" hidden>⬇ Instalar app</button>
    <a href="editor.html" class="link">[ editor de sectores ]</a>
  </header>

  <main>
    <section class="panel">
      <div class="aviso" id="borrador" hidden>
        <span>Usando tu <b>borrador local</b> del <a href="editor.html">editor</a> (no publicado).</span>
        <button type="button" id="usar-publicado">Ver publicado</button>
      </div>
      <div class="gps-bar">
        <button type="button" id="btn-ubicacion">📍 Mi ubicación</button>
        <button type="button" id="btn-seguir">Seguir</button>
      </div>
      <div id="gps" class="res gps" hidden aria-live="polite"></div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-modo="altura" class="active">Altura</button>
        <button type="button" role="tab" data-modo="esquina">Esquina</button>
        <button type="button" role="tab" data-modo="entre">Entre</button>
        <button type="button" role="tab" data-modo="lugar">Lugar</button>
      </div>

      <form id="form" autocomplete="off">
        <div class="modo-direccion">
          <label>Dirección
            <input id="direccion" list="calles" required placeholder="ej: San Martín 1250" enterkeyhint="search">
          </label>
        </div>
        <div class="campo-calle" hidden>
          <label>Calle
            <input id="calle" list="calles" placeholder="ej: San Martín">
          </label>
        </div>
        <div class="modo-lugar" hidden>
          <label>Lugar
            <input id="lugar" list="lugares" placeholder="ej: hospital, terminal, escuela 5">
          </label>
        </div>
        <div class="modo-esquina" hidden>
          <label>Esquina
            <input id="cruce" list="calles" placeholder="ej: Pinto">
          </label>
        </div>
        <div class="modo-entre" hidden>
          <label>Entre
            <input id="entre1" list="calles" placeholder="primera calle">
          </label>
          <label>y
            <input id="entre2" list="calles" placeholder="segunda calle">
          </label>
        </div>
        <button type="submit" id="buscar">Buscar</button>
      </form>

      <div id="resultado" aria-live="polite"></div>
      <p class="hint">Tip: tocá cualquier punto del mapa para ver su sector.</p>
    </section>

    <div id="map"></div>
  </main>

  <datalist id="calles"></datalist>
  <datalist id="lugares"></datalist>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script src="geo.js"></script>
  <script src="app.js"></script>
</body>
</html>
